<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">M5StarScope hardware connection diagram</title>
  <desc id="desc">A single HY2.0-4P Grove cable connects an M5Stack StopWatch to an AtomS3R. It carries ground, 5 volt power, and two UART lines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="1" stop-color="#13233d"/>
    </linearGradient>
    <linearGradient id="watchFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173b59"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020817" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-red" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L24,12 L0,24 Z" fill="#ff5b63"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L24,12 L0,24 Z" fill="#ffd23f"/>
    </marker>
    <marker id="arrow-white" markerWidth="24" markerHeight="24" refX="21" refY="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L24,12 L0,24 Z" fill="#f8fafc" stroke="#8290a6" stroke-width="1"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { fill: #f8fafc; font-size: 42px; font-weight: 700; letter-spacing: 0.5px; }
      .subtitle { fill: #9fb0c8; font-size: 22px; font-weight: 400; }
      .device-title { fill: #f8fafc; font-size: 30px; font-weight: 700; }
      .device-role { fill: #67d8ff; font-size: 17px; font-weight: 700; letter-spacing: 2px; }
      .device-detail { fill: #aebdd0; font-size: 18px; font-weight: 400; }
      .pin { fill: #f8fafc; font-size: 18px; font-weight: 700; }
      .wire-label { fill: #dce6f3; font-size: 18px; font-weight: 600; }
      .wire-detail { fill: #99abc2; font-size: 14px; font-weight: 400; }
      .note { fill: #aebdd0; font-size: 17px; font-weight: 400; }
      .note-strong { fill: #f8fafc; font-size: 17px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="80" cy="75" r="160" fill="#116c8d" opacity="0.10"/>
  <circle cx="1510" cy="820" r="260" fill="#7557ff" opacity="0.08"/>

  <text x="800" y="72" text-anchor="middle" class="title">M5StarScope — Hardware Connection</text>
  <text x="800" y="108" text-anchor="middle" class="subtitle">One HY2.0-4P / Grove cable carries both power and UART data</text>

  <!-- M5Stack StopWatch -->
  <g filter="url(#shadow)">
    <rect x="72" y="166" width="500" height="590" rx="30" fill="#111e33" stroke="#314765" stroke-width="2"/>
  </g>
  <text x="118" y="222" class="device-role">SKY ENGINE</text>
  <text x="118" y="261" class="device-title">M5Stack StopWatch</text>

  <circle cx="260" cy="420" r="112" fill="#060d18" stroke="#4f6685" stroke-width="9"/>
  <circle cx="260" cy="420" r="98" fill="url(#watchFace)" stroke="#67d8ff" stroke-width="2" opacity="0.98"/>
  <circle cx="226" cy="378" r="3" fill="#dff7ff"/>
  <circle cx="297" cy="350" r="2.5" fill="#ffe8a3"/>
  <circle cx="325" cy="432" r="4" fill="#c9e8ff"/>
  <circle cx="205" cy="456" r="2.5" fill="#ffd6b8"/>
  <circle cx="273" cy="487" r="3" fill="#e9f3ff"/>
  <circle cx="239" cy="411" r="2" fill="#dcecff"/>
  <circle cx="306" cy="390" r="1.8" fill="#f7fbff"/>
  <circle cx="185" cy="408" r="1.8" fill="#f7fbff"/>
  <line x1="260" y1="333" x2="260" y2="507" stroke="#67d8ff" stroke-opacity="0.35"/>
  <line x1="173" y1="420" x2="347" y2="420" stroke="#67d8ff" stroke-opacity="0.35"/>
  <circle cx="260" cy="420" r="14" fill="none" stroke="#67d8ff" stroke-width="2"/>

  <text x="118" y="578" class="device-detail">466 × 466 circular AMOLED</text>
  <text x="118" y="610" class="device-detail">Astronomy + rendering + RTC</text>
  <text x="118" y="642" class="device-detail">Controls + audio + Wi-Fi</text>

  <rect x="526" y="300" width="46" height="322" rx="12" fill="#1a2b45" stroke="#4b6382" stroke-width="2"/>
  <circle cx="550" cy="354" r="9" fill="#111827" stroke="#d4dfec" stroke-width="2"/>
  <circle cx="550" cy="430" r="9" fill="#ff5b63" stroke="#ffafb3" stroke-width="2"/>
  <circle cx="550" cy="506" r="9" fill="#ffd23f" stroke="#fff0a0" stroke-width="2"/>
  <circle cx="550" cy="582" r="9" fill="#f8fafc" stroke="#8b9bb2" stroke-width="2"/>

  <!-- AtomS3R -->
  <g filter="url(#shadow)">
    <rect x="1028" y="166" width="500" height="590" rx="30" fill="#111e33" stroke="#314765" stroke-width="2"/>
  </g>
  <text x="1074" y="222" class="device-role">ORIENTATION TRACKER</text>
  <text x="1074" y="261" class="device-title">AtomS3R</text>

  <rect x="1184" y="322" width="190" height="190" rx="34" fill="#202c3f" stroke="#5d7190" stroke-width="8"/>
  <rect x="1207" y="345" width="144" height="144" rx="18" fill="#07111f" stroke="#67d8ff" stroke-width="2"/>
  <path d="M1244 430 C1262 390 1295 385 1316 412 C1330 431 1318 456 1291 459 C1262 462 1234 452 1244 430Z" fill="none" stroke="#67d8ff" stroke-width="4"/>
  <circle cx="1281" cy="420" r="7" fill="#67d8ff"/>
  <path d="M1281 420 L1319 385" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>
  <path d="M1319 385 L1310 389 M1319 385 L1315 395" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>

  <text x="1074" y="578" class="device-detail">Gyroscope + accelerometer</text>
  <text x="1074" y="610" class="device-detail">+ magnetometer sensor fusion</text>
  <text x="1074" y="642" class="device-detail">Quaternion pose every 20 ms</text>

  <rect x="1028" y="300" width="46" height="322" rx="12" fill="#1a2b45" stroke="#4b6382" stroke-width="2"/>
  <circle cx="1050" cy="354" r="9" fill="#111827" stroke="#d4dfec" stroke-width="2"/>
  <circle cx="1050" cy="430" r="9" fill="#ff5b63" stroke="#ffafb3" stroke-width="2"/>
  <circle cx="1050" cy="506" r="9" fill="#ffd23f" stroke="#fff0a0" stroke-width="2"/>
  <circle cx="1050" cy="582" r="9" fill="#f8fafc" stroke="#8b9bb2" stroke-width="2"/>

  <!-- Cable and labels -->
  <path d="M560 354 C700 354 900 354 1040 354" fill="none" stroke="#050a12" stroke-width="8" stroke-linecap="round"/>
  <path d="M560 354 C700 354 900 354 1040 354" fill="none" stroke="#28364a" stroke-width="3" stroke-linecap="round"/>

  <path d="M560 430 C700 430 900 430 1037 430" fill="none" stroke="#ff5b63" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>

  <path d="M560 506 C700 506 900 506 1037 506" fill="none" stroke="#ffd23f" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-yellow)"/>

  <path d="M1040 582 C900 582 700 582 573 582" fill="none" stroke="#69788e" stroke-width="11" stroke-linecap="round"/>
  <path d="M1040 582 C900 582 700 582 573 582" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-white)"/>

  <rect x="674" y="329" width="252" height="48" rx="12" fill="#101d31" stroke="#2f4563"/>
  <text x="800" y="351" text-anchor="middle" class="wire-label">GND ↔ GND</text>
  <text x="800" y="370" text-anchor="middle" class="wire-detail">Black wire</text>

  <rect x="674" y="405" width="252" height="48" rx="12" fill="#101d31" stroke="#2f4563"/>
  <text x="800" y="427" text-anchor="middle" class="wire-label">5 V OUT → 5 V IN</text>
  <text x="800" y="446" text-anchor="middle" class="wire-detail">Red wire • StopWatch powers AtomS3R</text>

  <rect x="650" y="481" width="300" height="48" rx="12" fill="#101d31" stroke="#2f4563"/>
  <text x="800" y="503" text-anchor="middle" class="wire-label">GPIO 10 TX → GPIO 2 RX</text>
  <text x="800" y="522" text-anchor="middle" class="wire-detail">Yellow wire • UART 115200 baud</text>

  <rect x="632" y="557" width="336" height="48" rx="12" fill="#101d31" stroke="#2f4563"/>
  <text x="800" y="579" text-anchor="middle" class="wire-label">GPIO 11 RX ← GPIO 1 TX</text>
  <text x="800" y="598" text-anchor="middle" class="wire-detail">White wire • Orientation data at 50 Hz</text>

  <!-- Safety note -->
  <rect x="190" y="793" width="1220" height="62" rx="18" fill="#192943" stroke="#3a516f" stroke-width="2"/>
  <circle cx="232" cy="824" r="16" fill="#ffd23f"/>
  <text x="232" y="830" text-anchor="middle" fill="#172033" font-size="20" font-weight="700">!</text>
  <text x="266" y="830" class="note"><tspan class="note-strong">Development safety:</tspan> Disconnect the Grove cable while both devices are independently connected to USB.</text>
</svg>
