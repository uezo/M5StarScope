[platformio]
default_envs = stopwatch, atoms3r
src_dir = src
include_dir = include
test_dir = test

[env]
; Keep StopWatch and AtomS3R on one stable, registry-hosted release.
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
lib_deps =
    m5stack/M5Unified@0.2.19

[env:stopwatch]
board = esp32s3box
; Native USB Serial/JTAG resets and re-enumerates when a reconnecting monitor
; asserts these control lines. Keep monitoring passive; esptool still controls
; reset itself during upload.
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    ${env.lib_deps}
    DNSServer
    WebServer
    WiFi
    WiFiClientSecure
extra_scripts =
    pre:tools/configure_websocket_build.py
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter =
    +<stopwatch/>
    -<atoms3r/>
build_flags =
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DM5_STAR_SCOPE_STOPWATCH=1

[env:atoms3r]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_src_filter =
    +<atoms3r/>
    -<stopwatch/>
build_flags =
    -std=gnu++17
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DM5_STAR_SCOPE_ATOMS3R=1

[env:native]
platform = native
framework =
test_framework = unity
test_build_src = false
lib_deps =
build_flags =
    -std=c++17
    -DM5_STAR_SCOPE_NATIVE=1
    -DUNITY_INCLUDE_DOUBLE
